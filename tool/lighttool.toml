[tool]
id = "com.candytaco.lighthome"
label = "Home Assistant"
versionCode = 1
versionName = "0.1.0"
# CAMERA: scanning the setup QR code (server address + Cloudflare access key)
permissions = ["android.permission.INTERNET", "android.permission.ACCESS_NETWORK_STATE", "android.permission.CAMERA"]
# cleartext-http: allows plain http:// Home Assistant servers on the LAN
capabilities = ["cleartext-http"]
orientation = "portrait"
# for the LightOS emulator, use the line below and build with -DlightSdk.allowAltServerPackage=true
# serverPackage = "com.thelightphone.sdk.emulator"
serverPackage = "com.lightos"
